# =====================================================================
# Render Deployment Blueprint: VERDICT (Render Free Tier)
# Single-process Streamlit Service with In-Process Verification & TF-IDF Embeddings
# =====================================================================

services:
  - type: web
    name: verdict-claim-validator
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /_stcore/health
    envVars:
      - key: DATABASE_PATH
        value: /app/data/verdict.db
      - key: USE_TFIDF_EMBEDDINGS
        value: "true"
      - key: LLM_PROVIDER
        value: ""
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      # Optional Entailment Provider API Keys (Configure securely in Render Dashboard)
      # - key: GROQ_API_KEY
      #   sync: false
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: GEMINI_API_KEY
      #   sync: false
